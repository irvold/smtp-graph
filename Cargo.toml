[package]
name = "smtp-graph"
version = "0.2.0"
edition = "2021"
description = "Tager imod SMTP (fx fra scannere) og sender videre gennem Microsoft Graph"
license = "MIT"
authors = ["Irvold IT & Kommunikation"]
repository = "https://github.com/irvold/smtp-graph"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ipnet = "2"
mail-parser = "0.11"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Kun GUI'en (smtp-graph-gui.exe) bruger disse (feature "gui", slået fra i Linux-udgaven):
eframe = { version = "0.37.0", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
if-addrs = { version = "0.13", optional = true }
toml_edit = "0.22"
rsa = { version = "0.9", features = ["getrandom", "pem"] }
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:if-addrs"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
tokio-native-tls = "0.3"
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "smtp-graph"
path = "src/main.rs"

[[bin]]
name = "smtp-graph-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
strip = true

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
